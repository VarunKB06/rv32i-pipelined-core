name: RV32I regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Tool versions
        run: iverilog -V | head -1 && python3 --version
      - name: Golden-model self-test
        run: python3 tools/rv32.py --selftest
      - name: Regression (directed + 40 random programs)
        run: python3 tools/run_regression.py --random 40
      - name: Bug-injection check
        run: python3 tools/run_regression.py --mutate
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
